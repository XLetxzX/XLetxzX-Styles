// XLetxzX Styles: two parts (core = Mojang names, menu = Yarn names) merged into ONE mod jar.
// Build: gradlew mergeJars  ->  build/libs/XLetxzX-Styles-1.0-1.21.11.jar
plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT' apply false
}

String newest(String url, String prefix, String suffix, String fallback) {
    try {
        def xml = new URL(url).text
        def all = (xml =~ /<version>([^<]+)<\/version>/).collect { it[1] }
        def m = all.findAll { it.startsWith(prefix) && it.endsWith(suffix) }
        if (!m.isEmpty()) return m.last()
    } catch (Exception ignored) {}
    return fallback
}

ext.fabricApi = newest('https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml',
        '', '+' + project.minecraft_version, project.fabric_version)
ext.yarn = newest('https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml',
        project.minecraft_version + '+build.', '', project.yarn_mappings)
println 'Fabric API: ' + ext.fabricApi + '   Yarn: ' + ext.yarn

subprojects {
    apply plugin: 'fabric-loom'
    group = 'de.xletxzx'
    version = rootProject.mod_version
    base { archivesName = 'xletxzx-styles-' + project.name }
    tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

tasks.register('mergeJars', Jar) {
    dependsOn ':core:remapJar', ':menu:remapJar'
    archiveFileName = "XLetxzX-Styles-${project.mod_version}-${project.minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property('v', project.mod_version)
    from('merge') {
        filesMatching('fabric.mod.json') { expand 'version': project.mod_version }
    }
    from({ zipTree(project(':core').tasks.named('remapJar').get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json', 'META-INF/MANIFEST.MF'
    }
    from({ zipTree(project(':menu').tasks.named('remapJar').get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json', 'META-INF/MANIFEST.MF'
    }
}

// short source folders: core/java, core/res, menu/java, menu/res
subprojects {
    sourceSets.main.java.srcDirs = ['java']
    sourceSets.main.resources.srcDirs = ['res']
}
