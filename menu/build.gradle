dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabricApi}"
}
// Mod Menu API stubs: compiled together with the menu, but never packed
sourceSets.main.java.srcDirs += ['stubs']
jar { exclude 'com/terraformersmc/**' }
